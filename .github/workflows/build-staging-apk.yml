name: Build Staging APK

on:
  push:
    branches:
      - fix/rep-008-lockscreen-call-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-staging-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build staging debug APK
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://eyykjbrjwkogzaaywpmn.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_HVEuF0M6dig7CYwAxtcz9Q_WTwGubK6

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: InclusiChat-Staging-REP008
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
