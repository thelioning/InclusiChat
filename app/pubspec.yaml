name: inclusichat
description: "Mensajería privada e inclusiva para conectar con libertad."
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/inclusichat-logo-hd.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121820"
  adaptive_icon_foreground: "assets/branding/inclusichat-logo-hd.png"
  windows:
    generate: true
    image_path: "assets/branding/inclusichat-logo-hd.png"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/inclusichat-logo-hd.png
